databaseChangeLog:
  - changeSet:
      id: V1__ord7_create_transaction_table
      author: gin
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: transaction_date
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  value: SUCCESSFUL
                  constraints:
                    nullable: false
              - column:
                  name: sender_card_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: receiver_card_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)

        - createIndex:
            tableName: transactions
            indexName: idx_transaction_date
            columns:
              - column:
                  name: transaction_date

        - createIndex:
            tableName: transactions
            indexName: idx_transaction_status
            columns:
              - column:
                  name: status