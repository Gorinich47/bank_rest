databaseChangeLog:
  - changeSet:
      id: V1__ord3_create_roles_table
      author: gin
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    unique: true
                    nullable: false

#        - insert:
#            tableName: roles
#            columns:
#              - column:
#                  name: id
#                  valueNumeric: 0
#                  value: SUPER_ADMIN
        - insert:
            tableName: roles
            columns:
#              - column:
#                  name: id
#                  valueNumeric: 1
              - column:
                  name: name
                  value: ADMIN
        - insert:
            tableName: roles
            columns:
#              - column:
#                  name: id
#                  valueNumeric: 2
              - column:
                  name: name
                  value: USER
        - insert:
            tableName: roles
            columns:
#              - column:
#                  name: id
#                  valueNumeric: 3
              - column:
                  name: name
                  value: GUEST
        - createIndex:
            tableName: roles
            indexName: idx_roles_name
            columns:
              - column:
                  name: name
            unique: true

